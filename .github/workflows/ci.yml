name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    env:
      GOWORK: ${{ github.workspace }}/go.work.example
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go-with-cache
      - name: Run tests
        run: go test -race work

  module-test:
    runs-on: ubuntu-latest
    needs: detect-modules
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
        exclude:
          - module: ./_tools
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go-with-cache
      - name: Run module tests
        env:
          GOWORK: "off"
        run: go -C "${{ matrix.module }}" test -race work

  detect-modules:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.detect-modules.outputs.modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Go
        uses: ./.github/actions/setup-go-with-cache
      - name: Detect modules
        id: detect-modules
        uses: ./.github/actions/go-work-modules
